<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff">
  <title>Sign in · TrendAI Demo Platform</title>
  <link rel="icon" type="image/svg+xml" href="/brand/trendai-symbol.svg">
  <link rel="stylesheet" href="/styles.css"><script src="/login.js" defer></script>
</head>
<body class="login-view">
  <header class="login-brand"><img src="/brand/trendai-logo.png" alt="TrendAI" width="199" height="40"><span>Demo Platform</span></header>
  <main class="login-main"><section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Welcome back.</h1>
    <form id="login-form"><label class="login-label" for="password">Password</label>
      <div class="login-field"><input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required maxlength="256" aria-describedby="login-error">
        <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button type="submit" class="login-submit" aria-label="Sign in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </div><p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
    </form>
  </section></main>
  <footer class="login-footer">Powered by <strong>Bank Nattavut</strong></footer>
</body></html>
